name: Windows WPF build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AshkanLedgerPro.sln
      - name: Build WPF (Release) with MSBuild binary log
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Release -SkipRestore -SkipSmoke
      - name: Python regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Compile and run real PDF service smoke tests
        run: dotnet run --project tests/PdfRuntimeSmoke/PdfRuntimeSmoke.csproj --configuration Release
      - name: Upload MSBuild diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: artifacts/build/
          if-no-files-found: warn
          retention-days: 7
